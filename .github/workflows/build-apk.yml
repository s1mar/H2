name: Build APK

# Builds the debug APK in the cloud and attaches it to the run so you can
# download it — no Android Studio needed. Runs on every push to the feature
# branch, and on demand via the "Run workflow" button (workflow_dispatch).
on:
  push:
    branches: [ "claude/family-health-emergency-contact-h6hucg" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing repo secret GOOGLE_SERVICES_JSON. Add it in Settings -> Secrets and variables -> Actions (see README)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "Wrote app/google-services.json ($(wc -c < app/google-services.json) bytes)"

      - name: Build debug APK
        env:
          # Optional TURN credentials (leave the secrets unset for STUN-only).
          ORG_GRADLE_PROJECT_KIN_TURN_URL: ${{ secrets.KIN_TURN_URL }}
          ORG_GRADLE_PROJECT_KIN_TURN_USERNAME: ${{ secrets.KIN_TURN_USERNAME }}
          ORG_GRADLE_PROJECT_KIN_TURN_CREDENTIAL: ${{ secrets.KIN_TURN_CREDENTIAL }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
